networks:
  app-network:
    driver: bridge

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: eluma-backend
    restart: always
    ports:
      - "3003:3003"
    env_file:
      - .env
    networks:
      - app-network

  # Database service (optional for local PostgreSQL)
  db:
    image: postgres:16-alpine
    container_name: postgres-db
    environment:
      POSTGRES_USER: eluma
      POSTGRES_PASSWORD: ppp
      POSTGRES_DB: posgre
    ports:
      - "5432:5432"
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    networks:
      - app-network
